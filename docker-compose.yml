version: '3.8'

services:
  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:    
      POSTGRES_USER: mvalencia  # Tu usuario
      POSTGRES_PASSWORD: password123 # Tu contraseña
      POSTGRES_DB: curso_node_db # Nombre de la base de datos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: